<button id="accessibilityButton"
        type="button"
        aria-label="Open accessibility settings"
        aria-expanded="false"
        aria-controls="accessibilityPanel">
  <i class="fa-solid fa-wheelchair"></i>
</button>


<aside id="accessibilityPanel"
       aria-label="Accessibility settings"
       aria-hidden="true">

    <div class="accessibility-header">

        <h2>Accessibility</h2>

       <button id="accessibilityClose" type="button" class="btn btn-primary" aria-label="Close accessibility settings">
    ×
</button>

    </div>


    <!-- ===================================================== -->
    <!-- DISPLAY -->
    <!-- ===================================================== -->

    <section class="accessibility-section">

        <h3>Display</h3>


        <h4>Colour theme</h4>

        <button class="accessibility-option"
                type="button"
                data-setting="theme"
                data-value="light">
            Light
        </button>

        <button class="accessibility-option"
                type="button"
                data-setting="theme"
                data-value="dark">
            Dark
        </button>

        <button class="accessibility-option"
                type="button"
                data-setting="theme"
                data-value="high-contrast">
            High contrast
        </button>


        <h4>Saturation</h4>

        <button class="accessibility-option"
                type="button"
                data-setting="saturation"
                data-value="normal">
            Normal
        </button>

        <button class="accessibility-option"
                type="button"
                data-setting="saturation"
                data-value="low">
            Low
        </button>

        <button class="accessibility-option"
                type="button"
                data-setting="saturation"
                data-value="none">
            Grayscale
        </button>


        <button class="accessibility-option"
                type="button"
                data-toggle="highlightLinks">
            Highlight links
        </button>


        <button class="accessibility-option"
                type="button"
                data-toggle="hideImages">
            Hide images
        </button>


        <button class="accessibility-option"
                type="button"
                data-toggle="reduceMotion">
            Reduce motion
        </button>

    </section>


    <!-- ===================================================== -->
    <!-- TEXT -->
    <!-- ===================================================== -->

    <section class="accessibility-section">

        <h3>Text</h3>


        <h4>Text size</h4>

        <button class="accessibility-option"
                type="button"
                data-setting="textSize"
                data-value="small">
            A− Small
        </button>

        <button class="accessibility-option"
                type="button"
                data-setting="textSize"
                data-value="normal">
            A Normal
        </button>

        <button class="accessibility-option"
                type="button"
                data-setting="textSize"
                data-value="large">
            A+ Large
        </button>

        <button class="accessibility-option"
                type="button"
                data-setting="textSize"
                data-value="xlarge">
            A++ Extra large
        </button>

        <button class="accessibility-option"
                type="button"
                data-setting="textSize"
                data-value="xxlarge">
            A+++ Very large
        </button>


        <h4>Font</h4>

        <button class="accessibility-option"
                type="button"
                data-setting="font"
                data-value="default">
            Default
        </button>

        <button class="accessibility-option"
                type="button"
                data-setting="font"
                data-value="lexend">
            Lexend
        </button>

        <button class="accessibility-option"
                type="button"
                data-setting="font"
                data-value="opendyslexia">
            OpenDyslexic
        </button>


        <h4>Line height</h4>

        <button class="accessibility-option"
                type="button"
                data-setting="lineHeight"
                data-value="normal">
            Normal
        </button>

        <button class="accessibility-option"
                type="button"
                data-setting="lineHeight"
                data-value="relaxed">
            Relaxed
        </button>

        <button class="accessibility-option"
                type="button"
                data-setting="lineHeight"
                data-value="large">
            Extra large
        </button>


        <h4>Text spacing</h4>

        <button class="accessibility-option"
                type="button"
                data-setting="spacing"
                data-value="normal">
            Normal
        </button>

        <button class="accessibility-option"
                type="button"
                data-setting="spacing"
                data-value="wide">
            Wide
        </button>

        <button class="accessibility-option"
                type="button"
                data-setting="spacing"
                data-value="xwide">
            Extra wide
        </button>


         <!--<h4>Text alignment</h4>

        <button class="accessibility-option"
                type="button"
                data-setting="alignment"
                data-value="left">
            Left
        </button>

        <button class="accessibility-option"
                type="button"
                data-setting="alignment"
                data-value="center">
            Center
        </button>

        <button class="accessibility-option"
                type="button"
                data-setting="alignment"
                data-value="right">
            Right
        </button>

        <button class="accessibility-option"
                type="button"
                data-setting="alignment"
                data-value="justify">
            Justified
        </button>

    </section>-->


  

    <!-- ===================================================== -->
    <!-- RESET -->
    <!-- ===================================================== -->

    <button id="clearAccessibility"
            type="button" class="togglebutton">
        Clear preferences
    </button>

</aside>

<script>
    const panel = document.getElementById("accessibilityPanel");
const button = document.getElementById("accessibilityButton");

button.addEventListener("click", () => {

    const isOpen = panel.classList.toggle("open");

    button.setAttribute(
        "aria-expanded",
        isOpen
    );

});
</script>
